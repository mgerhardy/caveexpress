apply plugin: 'com.android.application'

def nativeLibDir = project.findProperty('nativeLibDir')
def assetsDir = project.findProperty('assetsDir')

android {
    namespace "org.caveproductions.game"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions "game"
    // Launcher icons live in src/<flavor>/res/mipmap-*/ic_launcher.png
    // (from contrib/<game>-icon-512x512.png).
    productFlavors {
        caveexpress {
            dimension "game"
            applicationId "org.caveexpress"
            versionCode 31
            versionName "2.7"
            resValue "string", "app_name", "CaveExpress"
            manifestPlaceholders = [gameActivity: "org.caveexpress.CaveExpress"]
        }
        cavepacker {
            dimension "game"
            applicationId "org.cavepacker"
            versionCode 11
            versionName "2.7"
            resValue "string", "app_name", "CavePacker"
            manifestPlaceholders = [gameActivity: "org.cavepacker.CavePacker"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            if (nativeLibDir) {
                jniLibs.srcDirs = [nativeLibDir]
            } else {
                jniLibs.srcDir 'libs'
            }
            if (assetsDir) {
                assets.srcDirs = [assetsDir]
            }
        }
    }

    lint {
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
