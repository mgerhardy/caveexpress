apply plugin: 'com.android.application'

def nativeLibDir = project.findProperty('nativeLibDir')
def assetsDir = project.findProperty('assetsDir')
// ANDROID_VERSION_* wins so a GitHub tag can override CMake/flavor defaults.
def injectedVersionName = System.getenv('ANDROID_VERSION_NAME') ?: project.findProperty('appVersionName')
def injectedVersionCode = System.getenv('ANDROID_VERSION_CODE') ?: project.findProperty('appVersionCode')
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace "org.caveproductions.game"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    flavorDimensions "game"
    // Launcher icons live in src/<flavor>/res/mipmap-*/ic_launcher.png
    // (from contrib/<game>-icon-512x512.png).
    productFlavors {
        caveexpress {
            dimension "game"
            applicationId "org.caveexpress"
            versionCode injectedVersionCode ? injectedVersionCode.toInteger() : 31
            versionName injectedVersionName ?: "2.7"
            resValue "string", "app_name", "CaveExpress"
            manifestPlaceholders = [gameActivity: "org.caveexpress.CaveExpress"]
        }
        cavepacker {
            dimension "game"
            applicationId "org.cavepacker"
            versionCode injectedVersionCode ? injectedVersionCode.toInteger() : 11
            versionName injectedVersionName ?: "2.7"
            resValue "string", "app_name", "CavePacker"
            manifestPlaceholders = [gameActivity: "org.cavepacker.CavePacker"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            if (nativeLibDir) {
                jniLibs.srcDirs = [nativeLibDir]
            } else {
                jniLibs.srcDir 'libs'
            }
            if (assetsDir) {
                assets.srcDirs = [assetsDir]
            }
        }
    }

    lint {
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
